<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burn Rate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: war-room wit; terse, plain verbs, real SRE vocabulary
IDEA: the incident whiteboard — topology in marker, pages as sticky notes, engineers as magnets, status page pinned beside it
PICTURE: the live dependency map; red marker spreads along edges as failures cascade
COLOUR and TYPE: whiteboard white, marker black/red/blue, sticky yellow, aluminium frame; Kalam on the board, Atkinson Hyperlegible for UI, Plex Mono for clock and figures
LAYOUT: thin top bar; board (map + sticky column + magnet tray) left, node card + status placard right; SLO row and log below */
:root{color-scheme:light;--wall:#e4e6e3;--board:#f6f7f5;--ink:#1c1f26;--mute:#5d6470;--faint:#c3c8cf;--red:#d8342a;--redt:#fde3df;--amber:#c47a00;--ambt:#fff2cc;--blue:#2456c9;--bluet:#e3ebfc;--ok:#1f8a55;--okt:#e2f3e9;--sticky:#ffe27a;--sticky2:#d6e8ff;--alu:#c7cbd1;--card:#fff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--wall);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hand{font-family:Kalam,cursive}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:10px max(2vw,14px);background:var(--board);border-bottom:2px solid var(--ink)}
.logo{font:700 28px/1 Kalam,cursive;display:flex;align-items:center;gap:6px;transform:rotate(-1.5deg)}
.logo svg{width:30px;height:30px}
.clk{font-size:26px;font-weight:600;line-height:1}
.sub{font-size:13px;color:var(--mute)}
.st{display:flex;flex-direction:column;font-size:13px;color:var(--mute);line-height:1.2}.st b{font:600 18px "IBM Plex Mono",monospace;color:var(--ink)}
.tm{width:92px;height:6px;background:var(--faint);border-radius:3px;margin-top:4px;overflow:hidden}.tm i{display:block;height:100%;background:var(--ok)}
.ctl{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.ctl button{background:var(--card);border:2px solid var(--ink);border-radius:10px;min-width:44px;height:42px;padding:0 10px;font-weight:700}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--board)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px max(2vw,14px) 0;max-width:1500px;margin:auto}
.frame{align-self:start;background:var(--alu);border-radius:14px;padding:10px;box-shadow:inset 0 1px 0 #fff8,0 2px 0 #9aa0a8}
.board{background:var(--board);border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr) 230px;min-height:420px;position:relative;box-shadow:inset 0 0 0 1px #0001}
.map{position:relative;padding:6px}
.map svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.notes{border-left:2px dashed var(--faint);padding:12px 10px;display:flex;flex-direction:column;gap:10px;max-height:620px;overflow:auto}
.notes h2{font:700 22px Kalam,cursive;margin:0}
.note{position:relative;background:var(--sticky);padding:10px 10px 8px;box-shadow:0 3px 6px #0002;font:400 16px/1.2 Kalam,cursive;border:0;text-align:left;width:100%;transform:rotate(var(--r,0deg))}
.note.ack{background:var(--sticky2)}.note.cl{opacity:.45}
.note.sel{outline:3px solid var(--blue);outline-offset:2px}
.note .nm{display:block;font:700 12px "Atkinson Hyperlegible",sans-serif;color:var(--mute);margin-top:4px}
.note .nb{display:flex;gap:6px;margin-top:6px}
.note .nb button{font:700 13px "Atkinson Hyperlegible",sans-serif;background:#fff9;border:1.5px solid var(--ink);border-radius:7px;padding:4px 8px;min-height:32px}
.note .cnt{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font:700 12px "Atkinson Hyperlegible";border-radius:10px;padding:2px 7px}
.note.fresh{animation:slap .35s ease-out}
@keyframes slap{from{transform:translateY(-16px) rotate(6deg);opacity:0}}
.quiet{color:var(--mute);font:16px Kalam,cursive}
.tray{grid-column:1/-1;margin:8px -4px -4px;background:linear-gradient(#d3d6db,#b8bdc4);border-radius:0 0 10px 10px;padding:10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tray .lab{font-size:13px;color:#3d434c;max-width:150px}
.mag{display:flex;align-items:center;gap:8px;background:#fff6;border-radius:30px;padding:4px 12px 4px 4px;border:0;touch-action:none;min-height:52px}
.mag svg{width:48px;height:48px;flex:none;filter:drop-shadow(0 3px 2px #0004)}
.mag b{display:block;font-size:15px;line-height:1.1}.mag small{font-size:12px;color:#3d434c}
.mag.busy,.mag.out{cursor:default}.mag.out{opacity:.5}
.mag:not(.busy):not(.out){cursor:grab}
.dragging,.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.ghost{position:fixed;z-index:50;pointer-events:none;width:56px;height:56px;margin:-28px 0 0 -28px;filter:drop-shadow(0 8px 6px #0005)}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px}
.card h2{font:700 24px/1.1 Kalam,cursive;margin:0 0 4px}
.card h3{font:700 20px/1.15 Kalam,cursive;margin:0}
.muted{color:var(--mute);font-size:14px}
.mrow{display:flex;gap:18px;margin:10px 0}.mrow small{display:block;color:var(--mute);font-size:13px}.mrow b{font:600 22px "IBM Plex Mono",monospace}
.deps{margin:8px 0;display:flex;flex-direction:column;gap:6px}
.dep{display:grid;grid-template-columns:minmax(0,1fr) 70px 46px;gap:8px;align-items:center;font-size:14px;background:none;border:0;padding:2px 0;text-align:left}
.bar{height:8px;background:#edeff1;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.intel{background:var(--bluet);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.intel p{margin:4px 0 0}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--card);border:2px solid var(--ink);border-radius:10px;min-height:44px;padding:6px 12px;font-weight:700}
.btn:hover:not([disabled]){background:#f0f2f4}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.on{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts .btn{font-size:14px;padding:6px 8px;text-align:left}.acts .btn span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.prog{height:10px;background:#edeff1;border-radius:5px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--blue)}
.placard{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:14px 16px;position:relative;transform:rotate(.6deg);box-shadow:0 4px 0 #0001}
.placard:before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--red);box-shadow:0 2px 2px #0004}
.pstate{font:700 20px Kalam,cursive;display:flex;align-items:center;gap:8px}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.trust{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}.trust b{font:600 30px "IBM Plex Mono",monospace}
.warnline{color:var(--red);font-weight:700;font-size:14px;min-height:1.4em}
.lower{display:grid;align-items:start;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px max(2vw,14px) 28px;max-width:1500px;margin:auto}
.slos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slo{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.slo.hot{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.slo .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.slo .h b{font:700 18px Kalam,cursive}.slo .h span{font-size:12px;color:var(--mute)}
.slo .bn{font:600 26px "IBM Plex Mono",monospace;line-height:1.1}
.slo canvas{width:100%;height:40px;display:block;margin:4px 0}
.bud{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.bt{height:8px;background:#edeff1;border-radius:4px;overflow:hidden;margin:3px 0 6px}.bt i{display:block;height:100%}
.sf{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.sf .btn{min-height:36px;padding:3px 10px;font-size:13px}
.log{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;font-size:14px}
.log li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--faint)}.log time{color:var(--mute);flex:none;font:500 12px "IBM Plex Mono",monospace;padding-top:2px}
.log .bad{color:var(--red)}.log .good{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;max-width:min(520px,92vw);box-shadow:0 8px 20px #0003;animation:tin .25s}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
.pop{position:absolute;z-index:30;width:280px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:0 12px 30px #0003}
.pop[hidden]{display:none}.pop h4{margin:0 0 8px;font:700 18px Kalam,cursive}
.ov{position:fixed;inset:0;z-index:60;background:#1c1f26b3;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:4vh 12px}
.ov[hidden]{display:none}
.modal{background:var(--board);border-radius:16px;max-width:900px;width:100%;padding:clamp(18px,3vw,34px);border:3px solid var(--ink);box-shadow:0 20px 60px #0005}
.modal h1{font:700 clamp(36px,6vw,56px)/1 Kalam,cursive;margin:0 0 10px;text-wrap:balance}
.modal p{max-width:66ch}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.how div{background:var(--sticky);padding:12px;box-shadow:0 3px 6px #0002}.how div:nth-child(2n){transform:rotate(1deg);background:var(--sticky2)}.how div:nth-child(2n+1){transform:rotate(-.8deg)}
.how b{display:block;font:700 19px Kalam,cursive;margin-bottom:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:10px}
.up{text-align:left;background:var(--card);border:2px solid var(--faint);border-radius:10px;padding:10px 12px;min-height:44px}
.up b{display:flex;justify-content:space-between;gap:8px}.up small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.up.picked{border-color:var(--blue);background:var(--bluet)}.up[disabled]{opacity:.45}
.pts{font-size:18px;margin:8px 0 14px}.pts b{font:600 34px "IBM Plex Mono",monospace;color:var(--blue)}
h4.g{font:700 20px Kalam,cursive;margin:14px 0 6px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:16px}
.choice button{text-align:left;padding:14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);min-height:44px}
.choice button b{display:block;font:700 19px Kalam,cursive}.choice button span{color:var(--mute);font-size:14px}
.grade{font:700 clamp(56px,10vw,92px)/1 Kalam,cursive;color:var(--red)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.charts div{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}.charts svg{width:100%;height:60px;display:block}
.charts b{font:700 16px Kalam,cursive}.charts span{float:right;font:600 14px "IBM Plex Mono",monospace}
/* map */
.edge{fill:none;stroke:var(--ink);stroke-linecap:round;opacity:.55}
.edge.soft{stroke-dasharray:3 7}
.flow{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 14;animation:flow var(--dur,1.4s) linear infinite;opacity:.7}
.e1 .edge{stroke:var(--amber);opacity:.9}.e1 .flow{stroke:var(--amber)}
.e2 .edge{stroke:var(--red);opacity:1;stroke-width:4.5}.e2 .flow{stroke:var(--red);animation-direction:reverse;stroke-dasharray:4 9}
@keyframes flow{to{stroke-dashoffset:-32}}
.paused .flow,.paused .fire,.paused .pulse,.paused .msg{animation-play-state:paused}
.nd{cursor:pointer}.nd.users{cursor:default}
.body{fill:#fff;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.nd.s1 .body{fill:var(--ambt)}.nd.s2 .body{fill:var(--redt);stroke:var(--red)}
.slot{stroke:var(--ink);stroke-width:1.6;opacity:.35}
.led{fill:var(--ok)}.nd.s1 .led{fill:var(--amber)}.nd.s2 .led{fill:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.lbl1{font:700 17px Kalam,cursive;fill:var(--ink);text-anchor:middle}
.lbl2{font:400 13px "Atkinson Hyperlegible",sans-serif;fill:var(--mute);text-anchor:middle}
.badge{display:none}.badge.on{display:inline}
.badge circle{fill:var(--red)}.badge text{font:700 15px Kalam,cursive;fill:#fff;text-anchor:middle}
.fire{display:none;transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}.fire.on{display:inline}
@keyframes flick{to{transform:scale(.88,1.08) rotate(3deg)}}
.selr{fill:none;stroke:var(--blue);stroke-width:3;stroke-dasharray:8 6;display:none}.nd.sel .selr{display:inline}
.pulse{fill:none;stroke:var(--red);stroke-width:3;display:none;transform-box:fill-box;transform-origin:center;animation:ring 1.2s ease-out infinite}.nd.pg .pulse{display:inline}
@keyframes ring{from{transform:scale(.95);opacity:.9}to{transform:scale(1.25);opacity:0}}
.nd.drop .body{stroke:var(--blue);stroke-width:4}
.msg{animation:msg 2.4s linear infinite}
@keyframes msg{from{transform:translateX(-26px);opacity:0}20%{opacity:1}80%{opacity:1}to{transform:translateX(26px);opacity:0}}
.wk text{font:700 13px "Atkinson Hyperlegible";fill:#fff;text-anchor:middle}
.wk .ring{fill:none;stroke:var(--ink);stroke-width:3;transform:rotate(-90deg)}
@media(max-width:1100px){.wrap,.lower{grid-template-columns:minmax(0,1fr)}.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
@media(max-width:760px){.board{grid-template-columns:minmax(0,1fr)}.notes{border-left:0;border-top:2px dashed var(--faint);max-height:400px}.slos{grid-template-columns:repeat(2,minmax(0,1fr))}.ctl{margin-left:0}}
@media(max-width:420px){.slos{grid-template-columns:minmax(0,1fr)}.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c2 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 4-11 1 3 2 4 4 5-1-4 0-8 1-11z" fill="#d8342a"/><path d="M16 16c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-5 1 1 1 2 2 2 0-2-1-3 0-5z" fill="#ffb199"/></svg>Burn Rate</div>
  <div><div class="clk mono" id="clock">08:00</div><div class="sub" id="day">Day 1 of 5</div></div>
  <div class="st">Features shipped<b id="feat">0 / 55</b></div>
  <div class="st">Customer trust<b id="trustTop">100</b><span class="tm"><i id="trustBar" style="width:100%"></i></span></div>
  <div class="st">Toil today<b id="toil">0.0</b></div>
  <div class="ctl" role="group" aria-label="Game controls">
    <button id="bpause" data-act="pause">Pause</button>
    <button data-act="speed" data-v="1" aria-pressed="true">1×</button>
    <button data-act="speed" data-v="2" aria-pressed="false">2×</button>
    <button data-act="speed" data-v="4" aria-pressed="false">4×</button>
    <button data-act="mute" id="bmute" aria-pressed="false">Sound on</button>
  </div>
</header>
<main class="wrap">
  <section class="frame" aria-label="Incident whiteboard">
    <div class="board">
      <div class="map" id="map"><svg id="svg" role="img" aria-label="Service dependency map"></svg><div class="pop" id="pop" hidden></div></div>
      <div class="notes" id="notes" aria-label="Pager"></div>
      <div class="tray" id="tray"></div>
    </div>
  </section>
  <aside class="side">
    <section class="card" id="det" aria-live="polite"></section>
    <section class="placard" id="status"></section>
  </aside>
</main>
<section class="lower">
  <div class="slos" id="slos" aria-label="Service level objectives"></div>
  <div class="card"><h2>Log</h2><ul class="log" id="log"></ul></div>
</section>
<div class="toast" id="toast" aria-live="polite"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const DAYS=5,DAYMIN=1440,TARGET=55,SCALE=12;
const CAUSES={
 deploy:{n:'Bad deploy',fix:'rollback',clue:'Errors started minutes after the last release.',sym:'5xx spike after release'},
 leak:{n:'Resource leak',fix:'restart',clue:'Memory and connections climb until processes get killed.',sym:'Processes OOMKilled'},
 spike:{n:'Traffic surge',fix:'scale',clue:'Requests at 3× baseline, CPU saturated.',sym:'CPU saturation'},
 node:{n:'Primary node failure',fix:'failover',clue:'Primary node unresponsive; replicas look healthy.',sym:'Primary unreachable'},
 cert:{n:'Expired certificate',fix:'renew',clue:'Clients failing TLS handshakes; the certificate expired.',sym:'TLS handshake failures'},
 disk:{n:'Disk full',fix:'expand',clue:'Writes failing; the volume is at 100%.',sym:'Disk usage 98%'}};
const CK=Object.keys(CAUSES);
const ACTIONS={rollback:{n:'Roll back',t:15},restart:{n:'Restart',t:10},scale:{n:'Scale out',t:15},failover:{n:'Fail over',t:20},renew:{n:'Renew cert',t:20},expand:{n:'Expand volume',t:15}};
const SEV={deploy:[.1,.3],leak:[.06,.16],spike:[.08,.22],node:[.25,.5],cert:[.2,.35],disk:[.12,.28]};
const NODES=[
 {id:'users',name:'Customers',type:'users'},
 {id:'edge',name:'Edge Gateway',type:'edge',causes:['cert','spike','deploy'],haz:.6},
 {id:'auth',name:'Auth Gateway',type:'svc',slo:99.3,causes:['deploy','leak','spike'],haz:.45},
 {id:'ledger',name:'Ledger API',type:'svc',slo:99.0,causes:['deploy','leak','spike'],haz:.9},
 {id:'reports',name:'Report Renderer',type:'svc',slo:98.5,causes:['deploy','leak','disk'],haz:1},
 {id:'analytics',name:'Analytics Engine',type:'svc',slo:99.0,causes:['deploy','leak','spike'],haz:.9},
 {id:'db',name:'Primary DB',type:'db',causes:['disk','node','leak'],haz:.55},
 {id:'queue',name:'Message Queue',type:'queue',causes:['disk','node','leak'],haz:.55},
 {id:'store',name:'Object Store',type:'store',causes:['node','disk'],haz:.45}];
const DEPS=[
 {from:'users',to:'edge',route:1},{from:'edge',to:'auth',route:1},{from:'edge',to:'ledger',route:1},{from:'edge',to:'reports',route:1},{from:'edge',to:'analytics',route:1},
 {from:'auth',to:'db',c:.8},{from:'ledger',to:'db',c:.8},{from:'ledger',to:'queue',c:.3},{from:'reports',to:'queue',c:.6},{from:'reports',to:'store',c:.7},{from:'analytics',to:'db',c:.5},{from:'analytics',to:'store',c:.6}];
const POS={h:{vb:[940,585],users:[70,280],edge:[225,280],auth:[485,72],ledger:[485,212],reports:[485,352],analytics:[485,492],db:[800,130],queue:[800,280],store:[800,430]},
           v:{vb:[420,830],users:[210,46],edge:[210,176],auth:[110,340],ledger:[310,340],reports:[110,500],analytics:[310,500],db:[70,700],queue:[210,700],store:[350,700]}};
const SLOS=NODES.filter(n=>n.slo).map(n=>n.id);
const SLOTS=id=>id==='auth'?[780]:[600,780,960];
const NOISE=['CPU above 80% on node-#','IO wait high on host-#','Heap at 75% on worker-#','Packet retransmits on lb-#','Cron job slow: cleanup-#','Synthetic check flapped 1 of 5','Thread pool at 70% on pod-#'];
const ENG=[{n:'Sam',c:'#d8342a'},{n:'Marcus',c:'#2456c9'},{n:'Chen',c:'#1f8a55'},{n:'Dana',c:'#c47a00'}];
const UP=[
 {id:'correlate',g:'Alerting',n:'Alert correlation',c:2,d:'Pages caused by the same failing dependency collapse into one sticky note.'},
 {id:'burn',g:'Alerting',n:'Burn-rate alerting',c:3,d:'Page on customer impact, not CPU. Noise −75%, SLO burn detected in ~2 min.'},
 {id:'tracing',g:'Alerting',n:'Distributed tracing',c:2,d:'Investigations take 10 min instead of 20 and always show which dependency is failing.'},

  $('#ov').hidden=true;G.running=true;G.paused=false;sigT=sigD='';
}
function spark(vals,lo,hi,col){const n=vals.length;if(n<2)return '';const Y=v=>58-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*56,pts=vals.map((v,i)=>(i/(n-1)*300).toFixed(1)+','+Y(v).toFixed(1)).join(' ');return `<svg viewBox="0 0 300 60" preserveAspectRatio="none"><line x1="0" x2="300" y1="${Y(0)}" y2="${Y(0)}" stroke="#5d6470" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`}
function score(){
  const rows=SLOS.map(id=>({s:N(id),rem:1-N(id).bad/N(id).budget}));
  const rel=rows.reduce((a,r)=>a+(r.rem>=0?10:Math.max(0,10*(1+r.rem))),0),vel=25*Math.min(1,G.features/TARGET);
  const avgF=G.team.reduce((a,e)=>a+e.fat,0)/4,team=Math.max(0,15*(1-avgF/100)-4*G.burnouts),trust=20*G.trust/100;
  return {rows,rel,vel,team,trust,avgF,total:Math.round(rel+vel+team+trust)};
}
function final(){
  const S=score();G.final=S;if(G.auto)return;
  const title=S.total>=85?'Principal SRE':S.total>=70?'Senior SRE':S.total>=55?'Site Reliability Engineer':S.total>=40?'Hero-culture survivor':'Pager zombie';
  const L=[];
  if(S.rows.some(r=>r.rem<0)&&G.st.exShips)L.push(`${G.st.exShips} release(s) went out on services with no error budget left. That's exactly when a budget policy should bite.`);
  if(!G.up.correlate&&G.pages>45)L.push(`${G.pages} pages for ${G.st.faults} failures. Without correlation, one broken database pages you once per service that depends on it.`);
  if(G.noisePages>8&&!G.up.burn)L.push(`${G.noisePages} pages were noise. Alerting on customer impact instead of CPU is the cheapest sleep you can buy.`);
  if(!G.up.breakers&&S.rows.some(r=>r.rem<0))L.push('Every dependency failure hit its callers at full strength. Circuit breakers turn outages into degradations.');
  if(G.trust<60)L.push(`Customer trust ended at ${Math.round(G.trust)}. Outages cost trust; silence during outages costs more.`);
  if(G.burnouts)L.push(`${G.burnouts} burnout(s). Heroics look like reliability right up until the hero goes offline mid-incident.`);
  if(G.st.auto)L.push(`Automation fixed ${G.st.auto} failure(s) on its own, several before anyone was paged.`);
  if(!Object.keys(G.pm).length)L.push('No postmortem action items were funded, so the same failures kept coming back.');
  if(!L.length)L.push('A balanced sprint: budget spent on purpose, customers kept informed, people rested. Write this one up as the playbook.');
  const ttr=G.st.ttr.length?Math.round(G.st.ttr.reduce((a,b)=>a+b,0)/G.st.ttr.length):0;
  $('#modal').innerHTML=`<p class="muted">Sprint complete</p><div class="grade">${S.total}</div><h1>${title}</h1>
  <div class="charts">${S.rows.map((r,i)=>`<div><b>${r.s.name}</b><span style="color:${r.rem>=0?'var(--ok)':'var(--red)'}">${Math.round(r.rem*100)}%</span>${spark(G.series.map(p=>p.b[i]).concat(r.rem),-.5,1,r.rem>=0?'#1f8a55':'#d8342a')}</div>`).join('')}<div><b>Customer trust</b><span>${Math.round(G.trust)}</span>${spark(G.series.map(p=>p.trust/100).concat(G.trust/100),0,1,'#2456c9')}</div></div>
  <p class="muted">Lines show error budget left across the sprint; the dashed line is zero.</p>
  <div class="how"><div><b>Reliability ${S.rel.toFixed(0)}/40</b>${S.rows.filter(r=>r.rem>=0).length} of 4 SLOs met.</div><div><b>Velocity ${S.vel.toFixed(0)}/25</b>${G.features} of ${TARGET} features.</div><div><b>Trust ${S.trust.toFixed(0)}/20</b>${G.st.majors} major incident(s).</div><div><b>Team ${S.team.toFixed(0)}/15</b>Average fatigue ${S.avgF.toFixed(0)}, ${G.burnouts} burnout(s).</div></div>
  <p class="muted">${G.st.faults} failures, mean time to fix ${ttr} min, ${G.pages} pages (${G.noisePages} noise).</p>
  <h4 class="g">Retro</h4><ul>${L.map(l=>`<li>${l}</li>`).join('')}</ul>
  <button class="btn pri" data-act="again" style="font-size:18px;padding:10px 24px">Run another sprint</button>`;
  $('#ov').hidden=false;
}
/* ---------- input ---------- */
function setSpeed(v){G.speed=v;document.querySelectorAll('[data-act=speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===v))}
function closePop(){$('#pop').hidden=true;popNode=null}
let popNode=null,popEng=null;
function openPop(id,eid){
  const n=N(id),e=G.team[eid];if(!n.causes)return;G.sel=id;G.pickEng=eid;
  if(n.task){toast(G.team[n.task.eng].name+' is already working on '+n.name+'.');return}
  popNode=id;popEng=eid;const pop=$('#pop'),m=$('#map').getBoundingClientRect(),r=$('#svg').querySelector(`[data-node="${id}"]`).getBoundingClientRect();
  pop.innerHTML=`<h4>${e.name} on ${n.name}</h4>${actionsHtml(false)}<button class="btn" data-act="closepop" style="margin-top:8px;width:100%">Cancel</button>`;pop.hidden=false;
  const pw=pop.offsetWidth,ph=pop.offsetHeight;let x=r.right-m.left+8,y=r.top-m.top-10;if(x+pw>m.width)x=r.left-m.left-pw-8;if(x<0)x=Math.max(4,(m.width-pw)/2);y=Math.max(4,Math.min(y,m.height-ph-4));pop.style.left=x+'px';pop.style.top=y+'px';
}
let justDropped=0;
document.addEventListener('click',ev=>{
  if(Date.now()-justDropped<300)return;
  const b=ev.target.closest('[data-act]');
  if(!b){const nd=ev.target.closest('[data-node]');if(nd&&nd.dataset.node!=='users'){G.sel=nd.dataset.node;sigD=''}if(!ev.target.closest('#pop'))closePop();ui();return}
  if(b.disabled)return;const a=b.dataset.act,n=G.sel&&N(G.sel);
  if(a==='start'){$('#ov').hidden=true;G.running=true;G.paused=false;log('Day 1 begins. '+G.team[0].name+' has the pager.');try{AC=AC||new AudioContext()}catch(e){}}
  else if(a==='pause'){if(G.running)G.paused=!G.paused}
  else if(a==='speed')setSpeed(+b.dataset.v);
  else if(a==='mute'){muted=!muted;b.textContent=muted?'Sound off':'Sound on';b.setAttribute('aria-pressed',muted)}
  else if(a==='freeze'){const s=N(b.dataset.id);s.frozen=!s.frozen;log(s.name+(s.frozen?': releases frozen.':': freeze lifted.'))}
  else if(a==='selnode'){G.sel=b.dataset.id;closePop()}
  else if(a==='eng')G.pickEng=+b.dataset.id;
  else if(a==='do'&&G.running){if(popNode!=null){startTask(N(popNode),popEng,b.dataset.k);closePop()}else if(n)startTask(n,G.pickEng,b.dataset.k)}
  else if(a==='closepop')closePop();
  else if(a==='cancel'&&n&&n.task){G.team[n.task.eng].busy=null;n.task=null}
  else if(a==='ack'){G.alerts.filter(x=>x.key===b.dataset.key&&!x.cleared).forEach(x=>x.acked=true)}
  else if(a==='silence'){G.alerts.filter(x=>x.key===b.dataset.key&&!x.cleared).forEach(x=>{if(x.kind==='burn')N(x.node).hot=0;if(x.kind!=='noise')G.st.silencedReal++;clearAlert(x)});log('Silenced a page.')}
  else if(a==='post')post(b.dataset.k);
  else if(a==='ev'){curEv[b.dataset.v][2]();curEv=null;$('#ov').hidden=true;G.paused=false}
  else if(a==='pick'){const P=G.plan;P.picks.has(b.dataset.id)?P.picks.delete(b.dataset.id):P.picks.add(b.dataset.id);renderPlan()}
  else if(a==='nextday')nextDay();
  else if(a==='again'){newGame();buildSlos();sigT=sigD=sigN=sigS=sigW='';lastLog=null;setSpeed(1);intro()}
  sigD='';sigN='';ui();
});
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('[data-node]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();G.sel=e.target.dataset.node;sigD='';ui();return}
  if(!$('#ov').hidden)return;
  if(e.code==='Space'){e.preventDefault();if(G.running)G.paused=!G.paused}
  if(['1','2','3'].includes(e.key))setSpeed([1,2,4][+e.key-1]);
  if(e.key==='Escape'){closePop();G.sel=null;sigD=''}
});
let drag=null;
document.addEventListener('pointerdown',e=>{const m=e.target.closest('.mag');if(!m||!G.running)return;const eng=G.team[+m.dataset.eng];if(eng.out||eng.busy!=null)return;e.preventDefault();document.body.classList.add('dragging');
  const gh=document.createElement('div');gh.className='ghost';gh.innerHTML=face(eng,56);document.body.appendChild(gh);drag={eng:eng.id,gh,sx:e.clientX,sy:e.clientY,moved:false};gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.gh.style.left=e.clientX+'px';drag.gh.style.top=e.clientY+'px';if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;
  document.querySelectorAll('.nd.drop').forEach(x=>x.classList.remove('drop'));const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-node]');if(t&&t.dataset.node!=='users')t.classList.add('drop')});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;d.gh.remove();document.body.classList.remove('dragging');justDropped=Date.now();window.getSelection()?.removeAllRanges();document.querySelectorAll('.nd.drop').forEach(x=>x.classList.remove('drop'));
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-node]');
  if(t&&t.dataset.node!=='users')openPop(t.dataset.node,d.eng);else if(!d.moved){G.pickEng=d.eng;sigD='';toast('Drag '+G.team[d.eng].name+' onto a box on the board, or pick a box and use the panel.')}
  ui()});
document.addEventListener('pointercancel',()=>{if(drag){drag.gh.remove();drag=null;document.body.classList.remove('dragging')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.running)G.paused=true});
const ro=new ResizeObserver(()=>{const v=$('#map').clientWidth<600?'v':'h';if(v!==layout){buildMap();closePop()}});
let last=performance.now(),uiT=0;
function frame(now){const real=Math.min(.25,(now-last)/1000);last=now;
  if(G.running&&!G.paused){let gm=real*SCALE*G.speed;while(gm>0&&G.running&&!G.paused){const d=Math.min(1,gm);step(d);gm-=d}}
  uiT+=real;if(uiT>.1){uiT=0;ui()}requestAnimationFrame(frame)}
newGame();buildMap();ro.observe($('#map'));buildSlos();intro();ui();requestAnimationFrame(frame);
}
</script></body></html>
